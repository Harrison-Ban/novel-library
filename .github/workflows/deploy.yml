name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'docs' --exclude '_site' --exclude '*.md' ./ _site/
          # 설정 화면에 표시할 버전과 배포 시각
          printf '{ "version": "0.1.%s", "commit": "%s", "builtAt": "%s" }\n' \
            "${{ github.run_number }}" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/version.json
          cat _site/version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
